<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style> .g { fill: #17C99E; } </style>
  </defs>
  <!-- Outer ring with gap at top (use stroke dash to create notch) -->
  <g transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#17C99E" stroke-width="80" stroke-linecap="butt" stroke-dasharray="950 180" />
    <circle cx="256" cy="256" r="110" fill="none" stroke="#17C99E" stroke-width="40" stroke-linecap="butt" stroke-dasharray="560 130" />
  </g>
  <!-- Center solid circle -->
  <circle cx="256" cy="256" r="46" fill="#161616" />
  <circle cx="256" cy="256" r="24" fill="#17C99E" />
</svg>
